<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Xe Buýt Trường Cao Đẳng Sonadezi</title>
    <link rel="stylesheet" href="Create.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo-3.png" alt="Logo Trường Cao Đẳng Sonadezi" class="logo">
        </div>
        <h1>Đăng Ký Xe Buýt Trường Cao Đẳng Sonadezi</h1>
    </header>

    <section id="dang-ky">
        <h2>Thông Tin Đăng Ký</h2>
        <form action="#" method="POST">
            <label for="ho-ten">Họ và Tên:</label>
            <input type="text" id="ho-ten" name="ho-ten" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="so-dien-thoai">Số Điện Thoại:</label>
            <input type="tel" id="so-dien-thoai" name="so-dien-thoai" required>

            <label for="tuyen-xe">Tuyến Xe:</label>
            <select id="tuyen-xe" name="tuyen-xe" required>
                <option value="tuyen-1">Tuyến 1: Bến xe A → Trường Cao Đẳng Sonadezi</option>
                <option value="tuyen-2">Tuyến 2: Bến xe B → Trường Cao Đẳng Sonadezi</option>
                <option value="tuyen-3">Tuyến 3: Bến xe C → Trường Cao Đẳng Sonadezi</option>
            </select>

            <label for="ngay-di">Ngày Khởi Hành:</label>
            <input type="date" id="ngay-di" name="ngay-di" required>

            <button type="submit">Đăng Ký</button>
        </form>
    </section>

    <section id="lien-he">
        <h2>Liên Hệ</h2>
        <p>Địa chỉ: Số 01,Đường 6A,KCN Biên Hoà II,Biên Hoà Đồng Nai</p>
        <p>Email: info@sonadezi.edu.vn</p>
        <p>Điện thoại: 0251.3994.011/012/013</p>
    </section>

    <footer>
        <p>&copy; 2025 Xe Buýt Trường Cao Đẳng SONADEZI. All rights reserved.</p>
    </footer>
</body>
</html>
